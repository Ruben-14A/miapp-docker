services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./code:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    image: wordpress:php8.3-fpm
    volumes:
      - ./code:/var/www/html
    environment:
       WORDPRESS_DB_HOST: db:3306
       WORDPRESS_DB_NAME: wordpress
       WORDPRESS_DB_USER: wordpress
       WORDPRESS_DB_PASSWORD: wordpress_local
    depends_on:
      - db

  db:
    image: mariadb:11.4
    environment:
       MARIADB_DATABASE: wordpress
       MARIADB_USER: wordpress
       MARIADB_PASSWORD: wordpress_local
       MARIADB_ROOT_PASSWORD: root_local
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: